<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

    <!-- Background Audio Element -->
    <audio id="bg-audio" loop preload="auto"></audio>

<!-- 1. FIXED TOP STRIPE HEADER WITH BOOTSTRAP NAVBAR & DROPDOWN -->
    {% include 'header.html' %}
    
    {% block content %}{% endblock %}

    <!-- Bottom Stripe Footer -->
    <footer class="bottom-stripe">
        {% block bottom %}{% endblock %}
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN (Required for Dropdowns to work) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Pass Flask template variables securely to JavaScript -->
    {% block bottom_script %}{% endblock %}

    <script src="static/script.js"></script>
</body>
</html>
